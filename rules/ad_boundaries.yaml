version: 1
description: '人工核验过的逐文件广告边界。


  为什么需要这张表：站方推广片是**多卡片轮播**，每支片子插的卡片数不一样，

  广告总长就跟着不一样 —— 同一条模板下的成员实测从 290 到 348 秒都有。

  模板只能记一个长度，套到这些文件上必然切错（实测最多差 53 秒）。


  cut_at = **站方推广片的终点**（从片头算起切掉多少秒）。

  1 秒粒度，人工逐帧看拼图 + 指纹跳变交叉验证得出。


  site_ad_end 记的是站方广告本身的终点，和 cut_at 相同说明中间没有厂牌片头。

  **厂牌片头 / 作品说明卡按约定保留**（MOGUOY 开场、OCCN 免责声明、

  マジックミラー号 卡、狗头卡、演员档案卡、作品简介卡等），

  所以这些文件的 cut_at 比正片起点早。


  分类口径：**带站点二维码/站点 logo 的推广卡算站方广告**；

  **黑底白字的作品简介 / 免责 / 厂牌 logo 卡算厂牌片头，保留**。'
