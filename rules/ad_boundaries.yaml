version: 1
description: '人工核验过的逐文件广告边界。


  为什么需要这张表：站方推广片是**多卡片轮播**，每支片子插的卡片数不一样，

  广告总长就跟着不一样 —— 同一条模板下的成员实测从 20 到 341 秒都有。

  模板只能记一个长度，套到这些文件上必然切错（实测最多差 48 秒）。


  cut_at = **从片头切掉多少秒** —— 也就是站方推广片的终点 + 1。


  site_ad_end 和 cut_at 相同：这张表记的是「站方广告到哪为止」，

  再往后是**要保留**的厂牌片头 / 作品说明卡。


  **厂牌片头 / 作品说明卡按约定保留**（MOGUOY 开场、OCCN 免责声明、

  マジックミラー号 卡、狗头卡、演员档案卡、作品简介卡、PRESTIGE logo 卡等），

  所以这些文件的 cut_at 比正片起点早 —— SVDVD-739 早 48 秒。


  分类口径：**带站点二维码 / 站点 logo 的推广卡算站方广告**；

  **黑底白字的作品简介 / 免责 / 厂牌 logo 卡算厂牌片头，保留**。

  「DOUJIN R18 成人向」分级卡带站点标识，算站方广告，裁掉。


  核验方法：**逐帧精确抽帧**（ffmpeg -ss <秒> -frames:v 1），

  一帧一帧看站方广告卡到哪结束。

  不能用 `-ss X -t N -vf fps=1` 的滤镜流水线 —— 这些片子 start_time 不是 0、

  关键帧稀疏，流水线的时间轴和源时间对不上（实测能差 10 秒）。


  2026-11-09：R 库 280 个视频中 182 支逐帧核验完毕，切点全部落表。

  '
