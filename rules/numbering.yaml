# 番号目录改名规则集
#
# 结构：
#   preprocess  —— 噪声剥离（与番号知识无关）
#   matches     —— 番号匹配（领域知识），按 priority 从高到低尝试
#
# 合成语义：
#   template    —— 用命名分组回填规范名；{raw} = 剥离后的核心串
#   dup_suffix  —— 重复副本标记的回贴方式；{dup} = 剥离出的标记序号
#
# 设计约定：厂牌与数字之间统一用「-」分隔，版本后缀（如 C / CX / AC）原样保留在末尾。

# 永不视为番号的名称形态（正则，匹配剥掉水印域名后的核心串）
#
# 这里的每一条都是**领域知识**：某个前缀/形态属于国产内容，不是日本番号。
# 命中排除有两个直接后果：
#   - rename 不会去改它（国产内容不该套番号规范）
#   - isolate 会把它判为「不符合番号规范」而挪到国产文件夹（GC）
#
# FLUP 是国产内容的编号。日期型（厂牌 + YYMMDD + 序号）同样是国产资源站的
# 目录编号 —— 实测库里 207 个这种目录（DOW/TEA/LRO/HEA/KEO/7K/WLF/DEL/XZO）
# **全部零番号文件**，内容是中文标题、站点编号、破解视频。
exclude:
  - '^FLUP[-_]?\d'
  - '^(?:DOW|TEA|LRO|HEA|KEO|7K|WLF|DEL|XZO)[-_]?\d'
  # MON、xfxfz 也是国产资源站的编号。实测 70 个这种目录（MON 17 + xfxfz 53）
  # 全部零番号文件，内容是中文标题、站点编号、破解视频。
  - '^(?:MON|xfxfz)[-_]?\d'

version: 1
description: "日本成人影片（番号）目录名规范化：去水印域名、去重复标记、统一 厂牌-数字 格式"

# 幂等性要求（重要）
# ------------------
# 规则输出的是**规范名**，规范名必须能被同一套规则重新解析回自己，
# 否则第二次跑 rename 就会把已经整理好的目录改坏。实测踩过的坑：
#
#   - 日期型规则只吃无横杠输入，却输出带横杠的 `DOW-240706-24`
#     -> 重新解析时被「厂牌-数字」规则抢先匹配，改成 `DOW-240706 (24)`
#   - 小写厂牌规则只吃无横杠输入，却输出带横杠的 `xfxfz-14681`
#     -> 重新解析时可选分组没匹配上，渲染出 `xfxfz-14681None`
#
# 所以：凡是本文件产出过的形态，都必须能被本文件重新解析。
# 改动任何一条 match 规则后，请对全库跑一次 rename 预览，确认破坏数为 0。

# 水印域名的后缀白名单
# --------------------
# 用 ``{tlds}`` 占位，加载时由 engine 注入实际列表。
# 以前这份列表在 5 条规则里各抄一遍，抄漏一个就有一条规则认不出那种域名 ——
# 实测踩过的坑：G 盘的 ``wbrr.life@ADN-683CX.mp4`` 因为 ``.life`` 没抄进去，
# 剥不掉域名，文件名就一直规范化不了。现在只有 engine.py 一处要改。
#
# 为什么是白名单而不是「任意后缀都行」：白名单能挡住
# ``xxx.jpg@番号`` 这类**文件名**里的 @，避免把图片名当域名剥掉。

preprocess:
  # 注意顺序：先捕获「域名里带 (N)」的副本标记，再剥域名。
  # 剥完域名后 (N) 已经不在串里，就再也捕不到了。
  - name: capture_watermark_dup
    description: "域名里带 (N) 的水印副本，如 aavv38(1).xyz@DVMM055A —— 记录 N 供回贴，避免与主目录撞名"
    pattern: '^[A-Za-z0-9._\-]*\((?P<wdup>\d+)\)\.[A-Za-z]{2,}@'
    capture: wdup

  - name: strip_double_watermark_domain
    description: "剥掉双重水印域名，如 aavv36.xyz@aavv36.xyz@SDMM095 -> SDMM095（单层规则只剥一次，剥不掉）"
    pattern: '^(?:[A-Za-z0-9._()\-]+\.(?:{tlds})@){2}'

  - name: strip_trailing_domain
    description: "剥掉尾部的水印域名，如 SDMM128Caavv38.xyz@ -> SDMM128C（番号在前、域名在后的形态）"
    # 番号段只含大写字母和数字，域名段含小写 —— 用大小写把两段分开。
    # 不能写成 `^(?P<code>.+?)(?P<domain>...)@$`：号码段用惰性匹配会只吃到 1 个字符，
    # 域名段的字符类又允许大写，结果整串被当成域名剥光（core 变空串）。
    pattern: '^(?P<code>[A-Z0-9]+)(?P<domain>[a-z0-9._\-]*\.[a-z]{2,})@$'
    replacement: '\g<code>'

  - name: strip_watermark_domain
    description: "剥掉前缀水印域名，如 aavv38.xyz@SDMM028 -> SDMM028"
    pattern: '^(?P<domain>[A-Za-z0-9._()\-]+\.(?:{tlds}))@'
    capture: domain

  - name: strip_joined_domain
    description: "剥掉与番号直接相连的前缀域名（无 @ 分隔），如 dxxdom.comSONE815 -> SONE815"
    # 形态：域名后面**紧贴**番号，中间没有 @ 也没有空格。
    # 与 strip_watermark_domain 的区别就在这里 —— 那条要求域名后面是 @。
    # 域名段全小写、番号段以大写字母开头，用大小写把两段切开。
    # 番号段允许连字符（KIN8-4069 这种厂牌自带数字），但不允许下划线
    # 和空格 —— 否则会把站点后缀（_uncensored 之类）一起吞进来。
    pattern: '^(?P<domain>[a-z0-9][a-z0-9._\-]*\.(?:{tlds}))(?P<code>[A-Z][A-Za-z0-9\-]*)$'
    replacement: '\g<code>'

  - name: strip_paren_dup
    description: "剥掉尾部重复副本标记 (1)（连前导空格一起剥 —— 否则规范名 'X-001 (1)' 反解不回来）"
    pattern: '\s*\((?P<dup>\d+)\)$'
    capture: dup
    conditional: true
  - name: strip_space_dup
    description: "剥掉尾部空格+数字重复标记 ' 2'"
    pattern: ' (?P<dup>\d+)$'
    capture: dup
    conditional: true

  - name: strip_hyphen_dup
    description: "剥掉尾部连字符+数字重复标记 -2（仅当剥完仍是合法番号才剥）"
    pattern: '-(?P<dup>\d+)$'
    capture: dup
    conditional: true

  - name: strip_hd_prefix
    description: "剥掉 HD_ 前缀"
    pattern: '^HD_'

  # ---- 以下三条是后来观察到的下载站形态 ----

  - name: strip_dash_domain
    description: "剥掉用横杠分隔的域名，如 htbet166.com-OKK007C -> OKK007C"
    pattern: '^(?P<domain>[A-Za-z0-9._()\-]+\.(?:{tlds}))-'

  - name: strip_space_domains
    description: "剥掉用空格分隔的多个域名，如 madoubt.com 853252.xyz DOKS-657 -> DOKS-657"
    pattern: '^(?:[A-Za-z0-9._()\-]+\.(?:{tlds})\s+)+'

  - name: strip_quality_suffix
    description: "剥掉画质后缀，如 STARS-542.HD -> STARS-542"
    pattern: '(?i:\.HD)$'

matches:
  # ---- 这里**没有**日期型规则 ----
  # 「厂牌 + YYMMDD + 序号」（DOW24070403 / TEA-240802-08）是**国产资源站的
  # 目录编号格式**，不是番号形态。实测库里 207 个这种目录全部零番号文件。
  # 曾经有一条 date_style 规则把它当番号规范化，结果国产内容被塞进了番号库；
  # 现在改成写进 exclude，并彻底删掉这条 match 规则 ——
  # 留着它，以后每次下载国产内容都会被规范化进番号库再挪一次。

  # ---- FC2 专属格式 ----
  - name: fc2
    description: "FC2 专属格式 FC2-PPV-4329956"
    pattern: '^FC2-PPV-(?P<num>\d{5,8})$'
    template: '{raw}'
    dup_suffix: ' ({dup})'
    priority: 95

  # ---- 厂牌-数字-版本（版本后缀前带横杠），如 ABF-292-AI ----
  - name: studio_dash_num_dash_ver
    description: "厂牌-序号-版本形 ABF-292-AI（版本后缀前带横杠）"
    pattern: '^(?P<studio>[A-Z]{2,6})-(?P<num>\d{2,6})-(?P<ver>[A-Z]{1,3})$'
    template: '{studio}-{num}-{ver}'
    dup_suffix: ' ({dup})'
    priority: 92

  # ---- 厂牌-数字（带横杠），如 MAAN-961 / IPZZ-118C / SSIS-863C ----
  - name: studio_dash_num
    description: "厂牌-序号形 MAAN-961 / IPZZ-118C / SSIS-863C"
    pattern: '^(?P<studio>[A-Z]{2,6})-(?P<num>\d{2,6})(?P<ver>[A-Z]{0,3})$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 90

  # ---- 数字前缀 + 厂牌-数字，如 230ORECO-640CX / 107MMGH-313 ----
  - name: prefix_num_studio
    description: "带数字前缀 230ORECO-640CX / 107MMGH-313"
    pattern: '^(?P<prefix>\d{2,4})(?P<studio>[A-Z]{3,6})-(?P<num>\d{2,6})(?P<ver>[A-Z]{0,3})$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 85

  # ---- 数字前缀 + 厂牌数字（**无横杠**），如 230ORECO894C ----
  # 与上面那条只差一个横杠，但下载站两个形态都出现过。
  - name: prefix_num_studio_nodash
    description: "带数字前缀但厂牌与序号之间无横杠 230ORECO894C"
    pattern: '^(?P<prefix>\d{2,4})(?P<studio>[A-Z]{3,6})(?P<num>\d{2,6})(?P<ver>[A-Z]{0,3})$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 84

  # ---- 厂牌+数字（无横杠），如 SDMM028C / MON004 / CAWD660CX ----
  - name: studio_num_ver
    description: "厂牌序号形 SDMM028C / MON004 / CAWD660CX"
    pattern: '^(?P<studio>[A-Z]{2,6})(?P<num>\d{2,5})(?P<ver>[A-Z]{0,3})$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 80

  # ---- FLUP 不在这里 ----
  # FLUP-* 是国产内容的编号，不是日本番号。
  # 不当番号处理的好处：目录名匹配不上番号规则 -> isolate 会把它判为
  # 「不符合番号规范」而挪到国产文件夹（GC），番号库里就不留国产内容了。

  # ---- 大写厂牌含数字带横杠，如 KIN8-4069 ----
  # 与下面的 lower_dash_digit_studio 是同一形态的大写版（KIN8 是厂牌名的一部分）。
  # 放在 studio_dash_num 之后：KIN8-4069 的厂牌段含数字，
  # studio_dash_num 要求厂牌是纯字母，本来就匹配不上，顺序不影响结果。
  - name: upper_dash_digit_studio
    description: "大写厂牌含数字带横杠 KIN8-4069"
    pattern: '^(?P<studio>[A-Z]{2,6}\d{1,2})-(?P<num>\d{1,8})(?P<ver>[A-Z]{1,3})?$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 69

  # ---- 小写厂牌含数字带横杠，如 kin8-3980 ----
  - name: lower_dash_digit_studio
    description: "小写厂牌含数字带横杠 kin8-3980"
    pattern: '^(?P<studio>[a-z]{2,6}\d{1,2})-(?P<num>\d{1,8})(?P<ver>-[A-Za-z]{1,3}|[A-Za-z]{1,3})?$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 71

  # ---- 小写厂牌带横杠，如 avop-235-C / sdmu-00877b ----
  # 版本后缀可能是大写（C）也可能是小写（b），两种都要收
  - name: lower_dash
    description: "小写厂牌带横杠 avop-235-C / sdmu-00877b"
    pattern: '^(?P<studio>[a-z]{3,8})-(?P<num>\d{1,8})(?P<ver>-[A-Za-z]{1,3}|[A-Za-z]{1,3})?$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 70

  # ---- 3 位小写厂牌无横杠，如 sgm00030 ----
  - name: lower_code_short_studio
    description: "3 位小写厂牌序号形 sgm00030"
    pattern: '^(?P<studio>[a-z]{3})(?P<num>\d{3,8})(?P<ver>[a-z]{0,2})$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 66

  # ---- 小写厂牌 + 数字（可带小写版本后缀），如 xfxfz14468 / dvdms00300a ----
  - name: lower_code
    description: "小写厂牌序号形 xfxfz14468 / dvdms00300a / sdmu00877b"
    pattern: '^(?P<studio>[a-z]{4,8})(?P<num>\d{3,8})(?P<ver>[a-z]{0,2})$'
    template: '{studio}-{num}{ver}'
    dup_suffix: ' ({dup})'
    priority: 65
