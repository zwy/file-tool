[project]
name = "file-tool"
version = "0.1.0"
description = "本地文件整理 CLI：批量重命名目录、番号规范化、文件名清洗"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
file-tool = "file_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["file_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
